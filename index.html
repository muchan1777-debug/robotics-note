<script id="site-data" type="application/json">{"profile": {"name": "김로봇 박사", "role": "Postdoctoral Researcher", "lab": "Autonomous Manipulation Lab", "badge": "2026 로봇공학 & Physical AI 연구소", "bio": "안녕하세요! 로봇공학 및 신체화된 인공지능(Physical AI)을 연구하는 김로봇입니다.\nVision-Language-Action (VLA) 모델, 다자유도 로봇 손 조작, 그리고 Real-to-Sim 강화학습을 주로 연구하고 있습니다.\n이 포트폴리오 웹사이트는 저의 연구 논문, 공부 노트, 이력을 코딩 없이 쉽게 기록하고 공유하는 개인 오픈 연구소 공간입니다.", "pubs": "8+", "cites": "450+", "hero1": "Robotic Intelligence &", "hero2": "Physical AI Research Lab", "email": "robot@lab.ac.kr", "github": "https://github.com", "scholar": "https://scholar.google.com"}, "research": [{"id": "res-1", "type": "research", "category": "VLA / ICRA 2026", "title": "Tactile-VLA: Visuomotor-Tactile Representation Learning for Dexterous In-Hand Manipulation", "summary": "고밀도 촉각 센서와 비전-언어-액션 모델을 통합하여 정밀 물체 조작 성공률을 향상시킨 학회 논문.", "content": "\u003cp>본 연구에서는 촉각 센서 데이터 벡터와 비전 토큰을 단일 Transformer 네트워크에 정렬하여 기존 비전 전용 모델 대비 조작 성공률을 38% 향상시켰습니다.\u003c/p>", "link1": "https://arxiv.org", "link2": "https://github.com", "date": "2026-02-12"}, {"id": "res-2", "type": "research", "category": "Sim-to-Real / IROS 2025", "title": "Zero-Shot Sim-to-Real Transfer of Bimanual Manipulation via Adaptive Domain Randomization", "summary": "NVIDIA Isaac Sim 환경에서 파라미터 미세조정 없이 물리 로봇에 직접 정책을 배포하는 파이프라인.", "content": "\u003cp>실시간 관절 오차를 피드백 받아 물리 시뮬레이션의 Domain Randomization 영역을 적응적으로 조정하는 파이프라인 제안.\u003c/p>", "link1": "#", "link2": "#", "date": "2025-10-18"}], "study": [{"id": "std-1", "type": "study", "category": "ROS 2", "title": "ROS 2 Lifecycle Nodes & Real-Time Executor 구현 정리", "summary": "노드 상태 전이(Unconfigured, Inactive, Active) 관리 및 Jitter 최소화 실시간 실행기 적용법.", "content": "\u003ch3>ROS 2 Managed Lifecycle Nodes\u003c/h3>\n        \u003cp>로봇 하드웨어 안전을 위해 상태 관리 노드를 작성하는 C++ 핵심 구조 예시:\u003c/p>\n        \u003cpre class=\"bg-slate-900 text-slate-100 p-3 rounded-xl font-mono text-xs my-3 overflow-x-auto\">\u003ccode>rclcpp_lifecycle::LifecycleNode::CallbackReturn\non_configure(const rclcpp_lifecycle::State &) {\n    RCLCPP_INFO(get_logger(), \"Hardware Interface Initialized.\");\n    return CallbackReturn::SUCCESS;\n}\u003c/code>\u003c/pre>", "date": "2026-02-01"}, {"id": "std-2", "type": "study", "category": "제어공학", "title": "Multi-DOF Robot Dynamics 리아프노프 안정성 해석 요약", "summary": "다자유도 관절 비선형 로봇 시스템에서의 리아프노프 에너 기반 점근적 안정성 증명 정리.", "content": "\u003cp>로봇의 관성 행렬 M(q)와 오차 벡터 e를 사용한 에너지 함수 V 설정 및 LaSalles Invariance Principle 증명 체계 정리.\u003c/p>", "date": "2026-01-20"}], "archive": [{"id": "arc-1", "type": "archive", "category": "연구일지", "title": "ICRA 2026 논문 채택 회고 및 촉각 센서 데이터셋 구축기", "summary": "6개월 동안 데이터 수집 장비를 직접 개조하며 겪은 시행착오와 학회 작성 팁.", "content": "\u003cp>실험 장비 커스텀 C++ 드라이버 에러 문제부터 리뷰어 질문 대응 과정에 대한 기록입니다.\u003c/p>", "date": "2026-02-15"}], "cv": [{"id": "cv-1", "type": "edu", "period": "2020 — 2025", "title": "기계항공공학 박사 (Ph.D.)", "org": "서울대학교 (Seoul National University)", "desc": "학위 논문: Visuomotor Policies for Robust Fine Dexterous Manipulation under External Disturbances."}, {"id": "cv-2", "type": "edu", "period": "2016 — 2020", "title": "기계공학과 학사 (B.S.)", "org": "KAIST", "desc": "Summa Cum Laude 졸업 (전산학 부전공)."}, {"id": "cv-3", "type": "exp", "period": "2025 — 현재", "title": "박사후 연구원 (Postdoctoral Researcher)", "org": "자율 조작 연구실 (Autonomous Robotics Lab)", "desc": "VLA 기반 로봇 손 촉각 모델 연구 및 실기 로봇 검증 총괄."}, {"id": "cv-4", "type": "exp", "period": "2023.06 — 2023.09", "title": "Robotics Research Intern", "org": "NVIDIA Robotics Research Lab", "desc": "Isaac Gym 시뮬레이터 환경에서 Multi-GPU 시뮬레이션 파이프라인 구축."}], "skills": [{"id": "sk-1", "title": "Robotics & Simulation", "tags": ["ROS 2", "Isaac Sim", "MuJoCo", "Pinocchio"]}, {"id": "sk-2", "title": "AI & Machine Learning", "tags": ["PyTorch", "Reinforcement Learning", "Diffusion Policy"]}, {"id": "sk-3", "title": "Languages & Tools", "tags": ["C++17/20", "Python", "CUDA", "Git / Docker"]}], "focus": [{"title": "Vision-Language-Action (VLA)", "description": "멀티모달 LLM과 로봇 관절 제어 정책을 결합하여 비정형 환경에서 자율 조작을 구현합니다."}, {"title": "Dexterous Manipulation", "description": "고밀도 촉각 피드백 기반 심층 강화학습을 통해 정밀한 로봇 손 물체 조작을 연구합니다."}, {"title": "Sim-to-Real Transfer", "description": "NVIDIA Isaac Sim 환경에서 학습된 모델을 실제 로봇에 오차 없이 전달하는 파이프라인 구축."}], "meta": {"revision": "2026-10-18-editorial-v1", "template": true}}</script>
<script>
'use strict';
const sourceData=JSON.parse(document.getElementById('site-data').textContent);
const isLocal=location.protocol==='file:';
let editing=false;
const labels={about:'소개',cv:'프로필 · CV',research:'연구',study:'공부 노트',archive:'기록'};
const postSections=['research','study','archive'];
const filterState={research:{category:'all',query:''},study:{category:'all',query:''},archive:{category:'all',query:''}};
function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function safeURL(value){try{if(!value||value==='#')return '';const u=new URL(value);return ['https:','http:'].includes(u.protocol)&&!u.username&&!u.password?u.href:'';}catch{return '';}}
function emailURL(value){return /^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(value)?'mailto:'+encodeURIComponent(value).replace(/%40/g,'@'):'';}
function normalizeData(input){
 if(!input||typeof input!=='object'||Array.isArray(input)||!['profile','research','study','archive','cv','skills'].some(k=>k in input))throw new Error('포트폴리오 백업 형식이 아닙니다.');
 const str=(v,fallback='',limit=200000)=>{if(v==null)return String(fallback??'');if(typeof v!=='string'&&typeof v!=='number')throw new Error('텍스트 항목의 형식을 확인해 주세요.');if(String(v).length>limit)throw new Error('내용이 너무 깁니다.');return String(v);};
 const obj=v=>{if(!v||typeof v!=='object'||Array.isArray(v))throw new Error('항목 형식이 올바르지 않습니다.');return v;};
 const arr=(name,limit=1000)=>{const v=input[name]??sourceData[name]??[];if(!Array.isArray(v)||v.length>limit)throw new Error('목록 형식 또는 항목 수를 확인해 주세요.');return v;};
 const p=input.profile==null?sourceData.profile:obj(input.profile);const profile={};
 for(const key of ['name','role','lab','badge','bio','pubs','cites','hero1','hero2','email','github','scholar'])profile[key]=str(p[key],sourceData.profile?.[key]??'',key==='bio'?10000:2000);
 profile.email=profile.email.replace(/^mailto:/i,'');
 const out={profile,meta:{revision:str(input.meta?.revision,sourceData.meta?.revision||'initial',200),template:typeof input.meta?.template==='boolean'?input.meta.template:(sourceData.meta?.template??true)}};
 const ids=new Set();
 for(const type of postSections){out[type]=arr(type).map((item,i)=>{obj(item);let id=str(item.id,type+'-'+i,200);if(!id||ids.has(id))id=type+'-import-'+i;while(ids.has(id))id+='x';ids.add(id);return {id,type,category:str(item.category,'',200),title:str(item.title,'제목 없음',1000),summary:str(item.summary,'',10000),content:str(item.content),date:str(item.date,'',30),link1:str(item.link1,'',2000),link2:str(item.link2,'',2000)};});}
 out.cv=arr('cv').map((item,i)=>{obj(item);return {id:str(item.id,'cv-'+i,200),type:item.type==='exp'?'exp':'edu',period:str(item.period,'',200),title:str(item.title,'',1000),org:str(item.org,'',1000),desc:str(item.desc,'',10000)};});
 out.skills=arr('skills',100).map((item,i)=>{obj(item);if(!Array.isArray(item.tags)||item.tags.length>200)throw new Error('기술 목록 형식을 확인해 주세요.');return {id:str(item.id,'sk-'+i,200),title:str(item.title,'',1000),tags:item.tags.map(t=>str(t,'',200))};});
 for(const group of ['cv','skills']){const used=new Set();out[group].forEach((record,i)=>{let id=record.id||group+'-'+i;while(used.has(id))id+='-'+i;used.add(id);record.id=id;});}
 out.focus=arr('focus',50).map(item=>{obj(item);return {title:str(item.title,'',500),description:str(item.description,'',10000)};});return out;
}
const initialData=normalizeData(sourceData);
let data=JSON.parse(JSON.stringify(initialData));
function icon(name){const paths={search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',moon:'<path d="M20.5 14A8.8 8.8 0 0 1 10 3.5 8.8 8.8 0 1 0 20.5 14Z"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',upRight:'<path d="M6 18 18 6M6 6h12v12"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/>',back:'<path d="M19 12H5m5-5-5 5 5 5"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',print:'<path d="M6 9V3h12v6M6 17H3V9h18v8h-3M6 14h12v7H6z"/><path d="M17 12h1"/>',up:'<path d="M12 19V5m-6 6 6-6 6 6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>'};return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.arrow}</svg>`;}
function brandMark(){return '<svg class="brand-mark" viewBox="0 0 35 40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 35V7h11c13 0 13 15 0 15H4m12 0 15 13M10 2h11v6M9 35h17"/><circle cx="25" cy="10" r="2.5" fill="var(--bg)"/></svg>';}
function diagram(){return `<div class="figure"><div class="figure-top"><span>MANIPULATION STUDIES</span><span>FIG. 01</span></div><svg class="robot-drawing" viewBox="0 0 350 275" role="img" aria-label="물체를 잡는 로봇 그리퍼의 개념도"><defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="currentColor" opacity=".2"/></pattern></defs><rect width="350" height="275" fill="url(#grid)"/><g fill="none" stroke="currentColor" stroke-width="1.2"><ellipse cx="174" cy="235" rx="105" ry="22" stroke-dasharray="2 5" opacity=".35"/><path d="M174 20v237M65 184h219" stroke-dasharray="3 5" opacity=".3"/><path d="M146 32h56v24h-56zM151 56v32l-34 34v35l18 22M197 56v32l34 34v35l-18 22"/><path d="M159 56v36l-28 34v27l13 18M189 56v36l28 34v27l-13 18"/><path d="M139 169l13 13-10 10-17-15zM209 169l-13 13 10 10 17-15z" fill="var(--wash)"/><rect x="133" y="29" width="82" height="16" rx="2" fill="var(--paper)"/><path d="M147 29V17h54v12"/><circle cx="151" cy="84" r="8" fill="var(--paper)"/><circle cx="197" cy="84" r="8" fill="var(--paper)"/><circle cx="151" cy="84" r="2"/><circle cx="197" cy="84" r="2"/><path d="m152 184 22-13 23 13v29l-23 13-22-13zM152 184l22 14 23-14M174 198v28" fill="var(--wash)"/><path d="m144 146-30 37m89-37 30 37" stroke-dasharray="3 3" opacity=".6"/><path d="M104 112H52v-8m185 34h62v-9M192 220l48 25h48" stroke-width=".8" opacity=".7"/><circle cx="104" cy="112" r="2" fill="currentColor"/><circle cx="237" cy="138" r="2" fill="currentColor"/></g><g fill="currentColor" font-family="monospace" font-size="8" letter-spacing="1"><text x="34" y="96">POLICY</text><text x="262" y="121">TACTILE</text><text x="251" y="258">ACTION</text></g></svg><div class="figure-caption"><span>Perception, contact, action.</span><span>조작 연구 개념도</span></div></div>`;}
function getRoute(){const raw=location.hash.slice(1);if(raw.startsWith('post/')){try{return {tab:'post',id:decodeURIComponent(raw.slice(5))};}catch{return {tab:'about'};}}return {tab:Object.hasOwn(labels,raw)?raw:'about'};}
function allPosts(){return postSections.flatMap(type=>data[type]);}
function postHref(post){return '#post/'+encodeURIComponent(post.id);}
function dateLabel(date){return /^\d{4}-\d{2}-\d{2}$/.test(date)?date.replaceAll('-','.'):date;}
function ordered(items){return [...items].sort((a,b)=>(b.date||'').localeCompare(a.date||''));}
function externalLink(url,label,cls='text-link'){const safe=safeURL(url);return safe?`<a class="${cls}" href="${esc(safe)}" target="_blank" rel="noopener noreferrer">${esc(label)} ${icon('upRight')}</a>`:'';}
function postLinks(p){return `<div class="post-links">${externalLink(p.link1,'논문 / 자료')}${externalLink(p.link2,'코드 / 관련 링크')}</div>`;}
function editActions(item,kind='post'){if(!editing)return '';return `<div class="edit-actions"><button data-action="edit-${kind}" data-id="${esc(item.id)}">편집</button><button class="danger" data-action="delete-${kind}" data-id="${esc(item.id)}">삭제</button></div>`;}
function publication(p){return `<article class="publication"><time class="pub-date" datetime="${esc(p.date)}">${esc(dateLabel(p.date))}</time><div><p class="pub-category">${esc(p.category)}</p><h3 class="pub-title"><a href="${postHref(p)}">${esc(p.title)}</a></h3><p class="pub-summary">${esc(p.summary)}</p>${postLinks(p)}${editActions(p)}</div><a class="arrow-link" href="${postHref(p)}" aria-label="${esc(p.title)} 읽기">${icon('upRight')}</a></article>`;}
function focusSection(){return `<section class="section"><div class="section-heading"><h2 class="section-title">Research interests<small>주요 연구 분야</small></h2><span class="eyebrow">01 — FOCUS</span></div><div class="focus-grid">${data.focus.map((f,i)=>`<article class="focus-item"><span class="index">0${i+1}</span><h3>${esc(f.title)}</h3><p>${esc(f.description)}</p>${editing?`<div class="edit-actions"><button data-action="edit-focus" data-index="${i}">편집</button></div>`:''}</article>`).join('')}</div></section>`;}
function aboutPage(){const p=data.profile;const research=ordered(data.research).slice(0,2),notes=ordered([...data.study,...data.archive]).slice(0,2);return `<div class="page"><section class="hero"><div><div class="status"><span class="status-dot"></span>${esc(p.badge)}</div><h1><span>${esc(p.hero1)}</span><em>${esc(p.hero2)}</em></h1><p class="hero-bio">${esc(p.bio)}</p><div class="hero-actions">${emailURL(p.email)?`<a class="btn btn-primary" href="${esc(emailURL(p.email))}">${icon('mail')} 이메일 문의</a>`:''}<div class="social-links">${externalLink(p.github,'GitHub')}${externalLink(p.scholar,'Scholar')}</div></div>${editing?'<div class="edit-actions"><button data-action="edit-profile">소개와 프로필 편집</button></div>':''}</div><aside>${diagram()}<div class="profile-strip"><div><strong>${esc(p.name)}</strong><p>${esc(p.role)}<br>${esc(p.lab)}</p></div><div class="profile-numbers"><div><b>${esc(p.pubs)}</b><span>게재 논문</span></div><div><b>${esc(p.cites)}</b><span>총 인용수</span></div></div></div></aside></section>${focusSection()}<section class="section"><div class="section-heading"><h2 class="section-title">Selected research<small>최근 연구</small></h2><a class="text-link" href="#research">전체 연구 ${icon('arrow')}</a></div>${research.map(publication).join('')||'<p class="empty">등록된 연구가 없습니다.</p>'}</section><section class="section"><div class="section-heading"><h2 class="section-title">From the notebook<small>최근 기록</small></h2><a class="text-link" href="#study">노트 둘러보기 ${icon('arrow')}</a></div><div class="latest-grid">${notes.map(n=>`<article class="latest-note"><p class="eyebrow">${esc(n.category)} · ${esc(dateLabel(n.date))}</p><h3><a href="${postHref(n)}">${esc(n.title)}</a></h3><p>${esc(n.summary)}</p><a class="text-link" href="${postHref(n)}">읽어보기 ${icon('arrow')}</a></article>`).join('')||'<p class="empty">아직 기록이 없습니다.</p>'}</div></section></div>`;}
function pageHeading(eyebrow,title,description,actions=''){return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p></div>${actions?`<div class="page-heading-actions">${actions}</div>`:''}</div>`;}
function noteCard(p){return `<article class="note"><div class="meta"><span>${esc(p.category)}</span><time datetime="${esc(p.date)}">${esc(dateLabel(p.date))}</time></div><h2><a href="${postHref(p)}">${esc(p.title)}</a></h2><p>${esc(p.summary)}</p><a class="text-link" href="${postHref(p)}">기록 읽기 ${icon('arrow')}</a>${editActions(p)}</article>`;}
function listPage(type){const info={research:['01 / RESEARCH','Research & projects','학회 논문과 연구 프로젝트. 아이디어를 실험과 검증으로 이어갑니다.'],study:['02 / NOTEBOOK','Study notes','로봇공학 이론, 개발 코드, 수학적 정리를 차곡차곡 기록합니다.'],archive:['03 / ARCHIVE','Field notes','실험실에서의 시행착오와 학회에서 만난 생각들.']}[type];const state=filterState[type];const cats=[...new Set(data[type].map(p=>p.category).filter(Boolean))];if(state.category!=='all'&&!cats.includes(state.category))state.category='all';return `<div class="page">${pageHeading(info[0],info[1],info[2],editing?`<button class="btn btn-primary" data-action="add-post" data-type="${type}">새 글 작성 +</button>`:'')}<div class="filter-row"><div class="filters" aria-label="${labels[type]} 분류"><button class="filter" data-action="filter" data-type="${type}" data-category="all" aria-pressed="${state.category==='all'}">전체 <span class="muted">${data[type].length}</span></button>${cats.map(cat=>`<button class="filter" data-action="filter" data-type="${type}" data-category="${esc(cat)}" aria-pressed="${state.category===cat}">${esc(cat)}</button>`).join('')}</div><label><span class="sr-only">${labels[type]}에서 검색</span><input class="list-search" type="search" data-list-search="${type}" value="${esc(state.query)}" placeholder="제목, 내용, 분류 검색" autocomplete="off"></label></div><div id="list-results" class="${type==='research'?'':'notes-grid'}" aria-live="polite">${listResults(type)}</div></div>`;}
function listResults(type){const state=filterState[type],q=state.query.toLocaleLowerCase().trim();const posts=ordered(data[type]).filter(p=>(state.category==='all'||p.category===state.category)&&(!q||[p.title,p.summary,p.category,p.content].some(t=>t.toLocaleLowerCase().includes(q))));return posts.map(type==='research'?publication:noteCard).join('')||'<div class="empty">해당하는 기록이 없습니다. 다른 검색어나 분류를 선택해 보세요.</div>';}
function cvItem(c){return `<article class="timeline-item"><span class="period">${esc(c.period)}</span><h3>${esc(c.title)}</h3><div class="org">${esc(c.org)}</div><p>${esc(c.desc)}</p>${editActions(c,'cv')}</article>`;}
function cvPage(){const p=data.profile;return `<div class="page">${pageHeading('PROFILE / CURRICULUM VITAE','A path in research','학력과 연구 경력, 그리고 연구를 뒷받침하는 도구들.',`${editing?'<button class="btn" data-action="edit-cv">이력 추가 +</button>':''}<button class="btn" data-action="print-cv">${icon('print')} CV 인쇄 / PDF 저장</button>`)}<div class="cv-intro"><div><h2>${esc(p.name)}</h2><p>${esc(p.role)} · ${esc(p.lab)}</p></div><div>${emailURL(p.email)?`<a href="${esc(emailURL(p.email))}">${esc(p.email)}</a>`:''}${editing?'<div class="edit-actions"><button data-action="edit-profile">프로필 편집</button></div>':''}</div></div><div class="cv-layout"><section class="cv-group"><h2>Education</h2>${data.cv.filter(c=>c.type==='edu').map(cvItem).join('')||'<p class="empty">등록된 학력이 없습니다.</p>'}</section><section class="cv-group"><h2>Experience</h2>${data.cv.filter(c=>c.type==='exp').map(cvItem).join('')||'<p class="empty">등록된 경력이 없습니다.</p>'}</section></div><section class="section"><div class="section-heading"><h2 class="section-title">Tools & skills<small>기술 스택</small></h2>${editing?'<button class="btn" data-action="edit-skill">기술 추가 +</button>':''}</div><div class="skills-grid">${data.skills.map(s=>`<article class="skill"><h3>${esc(s.title)}</h3><div class="tags">${s.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${editActions(s,'skill')}</article>`).join('')}</div></section></div>`;}
function cleanContent(html){
 if(!/<\/?(?:p|h[1-6]|ul|ol|li|pre|code|blockquote|a|strong|em|b|i|br|div|table)\b/i.test(html))return '<p>'+esc(html).replace(/\n/g,'<br>')+'</p>';
 const doc=new DOMParser().parseFromString(html,'text/html');
 const allowed=new Set(['P','H2','H3','H4','UL','OL','LI','PRE','CODE','BLOCKQUOTE','A','STRONG','EM','B','I','BR','DIV','SPAN','TABLE','THEAD','TBODY','TR','TH','TD','HR','S','SUB','SUP']);
 const blocked=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','FORM','INPUT','BUTTON','SVG','MATH','META','LINK','BASE','TEMPLATE','NOSCRIPT']);
 function walk(parent){for(const n of [...parent.childNodes]){if(n.nodeType===8){n.remove();continue;}if(n.nodeType!==1)continue;if(blocked.has(n.tagName)){n.remove();continue;}walk(n);if(!allowed.has(n.tagName)){n.replaceWith(...n.childNodes);continue;}const href=n.tagName==='A'?safeURL(n.getAttribute('href')):'';for(const attr of [...n.attributes])n.removeAttribute(attr.name);if(href){n.setAttribute('href',href);n.setAttribute('target','_blank');n.setAttribute('rel','noopener noreferrer');}}}walk(doc.body);return doc.body.innerHTML;
}
function readerPage(id){const p=allPosts().find(p=>p.id===id);if(!p)return `<div class="page reader">${pageHeading('NOT FOUND','기록을 찾을 수 없습니다.','주소를 확인하거나 전체 연구 목록에서 찾아보세요.')}<a class="btn" href="#research">연구 목록으로 ${icon('arrow')}</a></div>`;const plain=p.content.replace(/<[^>]*>/g,'');const minutes=Math.max(1,Math.ceil(plain.length/650));return `<article class="page reader"><a class="text-link back-link" href="#${p.type}">${icon('back')} ${labels[p.type]}로 돌아가기</a><div class="article-meta"><span>${esc(p.category)}</span><time datetime="${esc(p.date)}">${esc(dateLabel(p.date))}</time><span>약 ${minutes}분 읽기</span></div><h1>${esc(p.title)}</h1><p class="lead">${esc(p.summary)}</p><div class="prose">${cleanContent(p.content||p.summary)}</div>${postLinks(p)}${editActions(p)}<div class="article-end"><a class="text-link" href="#${p.type}">${icon('back')} 모든 ${labels[p.type]}</a><button class="btn" data-action="share-post">${icon('copy')} 글 링크 복사</button></div></article>`;}
function renderHeader(active){document.getElementById('header').innerHTML=`<a class="brand" href="#about" aria-label="${esc(data.profile.name)} 소개">${brandMark()}<span><span class="brand-name">${esc(data.profile.name)}</span><span class="brand-sub">ROBOTICS · RESEARCH & NOTES</span></span></a><nav class="nav" aria-label="주요 메뉴">${Object.entries(labels).map(([id,title])=>`<a href="#${id}" ${id===active?'aria-current="page"':''}>${title}</a>`).join('')}</nav><div class="header-actions"><button class="icon-btn" data-action="search" aria-label="전체 기록 검색" title="전체 기록 검색 (Ctrl/⌘ K)">${icon('search')}</button><button class="icon-btn" data-action="theme" aria-label="화면 테마 변경" title="화면 테마 변경">${icon(document.documentElement.dataset.theme==='dark'?'sun':'moon')}</button></div>`;}
function renderFooter(){document.getElementById('footer').innerHTML=`<div class="footer-inner"><p>© ${new Date().getFullYear()} ${esc(data.profile.name)} <span aria-hidden="true">/</span> Research, in progress.</p><div class="footer-links"><button id="local-edit-trigger" class="local-only" data-action="toggle-editor">사이트 편집</button>${emailURL(data.profile.email)?`<button data-action="copy-email">이메일 복사</button>`:''}<button class="text-link" data-action="top">맨 위로 ${icon('up')}</button></div></div>${data.meta.template?'<p class="footer-note">원본 템플릿의 예시 이름·경력·논문을 포함한 디자인 미리보기입니다.</p>':''}`;}
function renderApp(){const r=getRoute();const p=r.tab==='post'?allPosts().find(p=>p.id===r.id):null;renderHeader(p?.type||r.tab);document.title=(p?p.title:labels[r.tab]||'포트폴리오')+' — '+data.profile.name;document.getElementById('main').innerHTML=r.tab==='about'?aboutPage():r.tab==='cv'?cvPage():r.tab==='post'?readerPage(r.id):listPage(r.tab);renderFooter();if(typeof renderEditorBar==='function')renderEditorBar();}
let lastFocus=null;
function showDialog(title,body){const dialog=document.getElementById('dialog');lastFocus=document.activeElement;document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=body;if(!dialog.open)dialog.showModal();}
function closeDialog(){const dialog=document.getElementById('dialog');if(dialog.open)dialog.close();}
let toastTimer;
function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),5500);}
function openSearch(){showDialog('기록 검색',`<label for="global-search" class="sr-only">전체 기록 검색</label><input id="global-search" class="search-input" type="search" placeholder="궁금한 주제나 키워드를 입력하세요" autocomplete="off"><div id="global-results" class="search-results" aria-live="polite"></div><p class="search-hint">연구 · 공부 노트 · 기타 기록을 함께 검색합니다.</p>`);updateGlobalSearch('');document.getElementById('global-search').focus();}
function updateGlobalSearch(query){const q=query.toLocaleLowerCase().trim();const result=ordered(allPosts()).filter(p=>!q||[p.title,p.category,p.summary,p.content].some(v=>v.toLocaleLowerCase().includes(q)));document.getElementById('global-results').innerHTML=result.map(p=>`<a class="search-result" href="${postHref(p)}" data-close-search><small>${labels[p.type]} / ${esc(p.category)}</small><strong>${esc(p.title)}</strong></a>`).join('')||'<p class="empty">검색 결과가 없습니다.</p>';}
async function copyText(value){try{if(!navigator.clipboard)throw new Error();await navigator.clipboard.writeText(value);notify('복사했습니다.');}catch{showDialog('복사하기',`<p class="form-hint">아래 내용을 선택해 복사해 주세요.</p><label class="field"><span class="sr-only">복사할 내용</span><input id="copy-fallback" readonly value="${esc(value)}"></label>`);const el=document.getElementById('copy-fallback');el.focus();el.select();}}
function printCV(){const p=data.profile;const section=(title,items)=>`<h2>${title}</h2>${items.map(c=>`<article><span class="period">${esc(c.period)}</span><h3>${esc(c.title)}</h3><p>${esc(c.org)}</p><p>${esc(c.desc)}</p></article>`).join('')}`;document.getElementById('print-content').innerHTML=`<h1>${esc(p.name)}</h1><p>${esc(p.role)} · ${esc(p.lab)}</p><p>${esc(p.email)}</p>${section('Education',data.cv.filter(c=>c.type==='edu'))}${section('Experience',data.cv.filter(c=>c.type==='exp'))}<h2>Skills</h2>${data.skills.map(s=>`<article><h3>${esc(s.title)}</h3><p>${s.tags.map(esc).join(' · ')}</p></article>`).join('')}<h2>Research</h2>${ordered(data.research).map(r=>`<article><span class="period">${esc(r.date)} · ${esc(r.category)}</span><h3>${esc(r.title)}</h3><p>${esc(r.summary)}</p></article>`).join('')}${data.meta.template?'<p>원본 템플릿의 예시 내용입니다.</p>':''}`;window.print();}
function startApp(){
 document.documentElement.classList.toggle('is-local',isLocal);
 try{const theme=localStorage.getItem('robotics-portfolio-theme');if(theme==='dark')document.documentElement.dataset.theme='dark';else document.documentElement.dataset.theme='light';}catch{document.documentElement.dataset.theme='light';}
 if(isLocal){try{const saved=localStorage.getItem(DRAFT_KEY);if(saved)data=normalizeData(JSON.parse(saved));}catch{notify('저장된 초안을 불러오지 못해 이 파일의 내용으로 열었습니다.');}}
 renderApp();
 window.addEventListener('hashchange',()=>{closeDialog();renderApp();window.scrollTo({top:0,behavior:'instant'});document.getElementById('main').focus({preventScroll:true});});
 document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(event.target.closest('[data-close-search]'))closeDialog();if(!button)return;const action=button.dataset.action;if(action==='search')openSearch();else if(action==='close-dialog')closeDialog();else if(action==='theme'){const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;try{localStorage.setItem('robotics-portfolio-theme',next);}catch{}const r=getRoute();renderHeader(r.tab==='post'?(allPosts().find(p=>p.id===r.id)?.type||'about'):r.tab);}else if(action==='top'){window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}else if(action==='skip'){event.preventDefault();document.getElementById('main').focus();}else if(action==='filter'){filterState[button.dataset.type].category=button.dataset.category;renderApp();const match=[...document.querySelectorAll('[data-action=filter]')].find(b=>b.dataset.category===button.dataset.category);match?.focus({preventScroll:true});}else if(action==='copy-email')copyText(data.profile.email);else if(action==='print-cv')printCV();else if(action==='share-post'){if(isLocal){notify('이 파일을 게시한 사이트에서 글 링크를 복사해 주세요. 로컬 파일 주소는 다른 기기에서 열 수 없습니다.');}else{const link=location.href;if(/^(?:https?:\/\/)/.test(link)&&!location.hostname.endsWith('googleusercontent.com'))copyText(link);else showDialog('글 공유',`<p>Google Sites에 삽입한 화면은 방문자용 사이트 주소로 공유해 주세요.</p><p class="form-hint" style="margin-top:12px">${esc(allPosts().find(p=>p.id===getRoute().id)?.title||'')}</p>`);}}});
 document.addEventListener('input',event=>{if(event.target.id==='global-search')updateGlobalSearch(event.target.value);const type=event.target.dataset.listSearch;if(type&&filterState[type]){filterState[type].query=event.target.value;document.getElementById('list-results').innerHTML=listResults(type);}});
 document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();openSearch();}});
 const dialog=document.getElementById('dialog');dialog.addEventListener('click',event=>{if(event.target===dialog){const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeDialog();}});dialog.addEventListener('close',()=>{lastFocus?.isConnected&&lastFocus.focus({preventScroll:true});});
}

/* The editor keeps drafts on this device. Published HTML is a read-only snapshot. */
const DRAFT_KEY = 'robotics-portfolio-v2:' + initialData.meta.revision;

  const bar = document.getElementById('editor-bar');
  const trigger = document.getElementById('local-edit-trigger');
  if (trigger) {
    trigger.hidden = !isLocal;
    trigger.textContent = editing ? '편집 마치기' : '사이트 편집';
    trigger.setAttribute('aria-pressed', String(editing));
  }
  if (!bar) return;
  bar.hidden = !isLocal || !editing;
  bar.innerHTML = !isLocal || !editing ? '' : `
    <div class="editor-panel">
      <div class="editor-panel-copy"><strong>이 기기에서 편집 중</strong>
        <p>변경 사항은 이 브라우저에 임시 저장됩니다. ‘공개용 HTML 저장’으로 내보낸 뒤 게시된 파일을 교체하면 방문자에게 반영됩니다.</p>
      </div>
      <div class="editor-actions">
        <button type="button" class="button button-primary" data-action="editor-export">공개용 HTML 저장</button>
        <button type="button" class="button button-quiet" data-action="editor-copy-embed">Google Sites 코드 복사</button>
        <button type="button" class="button button-quiet" data-action="editor-backup">JSON 백업</button>
        <button type="button" class="button button-quiet" data-action="editor-restore">백업 복원</button>
        <button type="button" class="button button-quiet" data-action="editor-reset">파일의 초기 내용으로</button>
      </div>
      <details class="editor-note" style="margin-top:12px"><summary style="cursor:pointer">Google Sites에 게시하는 방법</summary>
        <ol style="padding-left:20px;margin:8px 0 4px">
          <li>Google Sites에서 삽입 → 삽입 → 코드 삽입을 선택하고, 복사한 코드를 붙여넣습니다.</li>
          <li>공유 → 게시된 사이트 → 공개로 설정한 뒤 게시합니다.</li>
        </ol>
        <p>학교·기관에서 공개 옵션을 제한하면 해당 관리자 정책이 적용됩니다. 편집 주소가 아닌 게시된 주소를 공유하세요.</p>
      </details>
    </div>`;
}

(function () {
  'use strict';
  const postTypes = ['research', 'study', 'archive'];
  const labels = {research: '연구', study: '공부 노트', archive: '기타 기록'};
  const clone = object => JSON.parse(JSON.stringify(object));
  const uid = prefix => prefix + '-' + (globalThis.crypto?.randomUUID?.() || Date.now().toString(36) + Math.random().toString(36).slice(2));
  let storageWarningShown = false;

  function persistDraft() {
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify(data));
      return true;
    } catch (error) {
      if (!storageWarningShown) {
        storageWarningShown = true;
        notify('이 브라우저에서는 임시 저장이 제한됩니다. 창을 닫기 전 공개용 HTML 또는 JSON 백업을 저장해 주세요.');
      }
      return false;
    }
  }

  function commit(next, message = '저장했습니다.') {
    const validated = normalizeData(next);
    data = validated;
    const saved = persistDraft();
    closeDialog();
    renderApp();
    if (saved) notify(message);
  }

  function field(name, label, value = '', options = {}) {
    const type = options.type || 'text';
    const attrs = `${options.required ? ' required' : ''}${options.max ? ` maxlength="${options.max}"` : ''}`;
    const placeholder = options.placeholder ? ` placeholder="${esc(options.placeholder)}"` : '';
    const input = type === 'textarea'
      ? `<textarea id="editor-${name}" name="${name}" rows="${options.rows || 4}"${attrs}${placeholder}>${esc(value)}</textarea>`
      : `<input id="editor-${name}" name="${name}" type="${type}" value="${esc(value)}"${attrs}${placeholder}>`;
    return `<label class="editor-field${options.wide ? ' editor-field-wide' : ''}" for="editor-${name}"><span>${esc(label)}</span>${input}${options.note ? `<small>${esc(options.note)}</small>` : ''}</label>`;
  }

  function select(name, label, options, selected) {
    return `<label class="editor-field" for="editor-${name}"><span>${esc(label)}</span><select id="editor-${name}" name="${name}">${options.map(([value, text]) => `<option value="${esc(value)}"${value === selected ? ' selected' : ''}>${esc(text)}</option>`).join('')}</select></label>`;
  }

  function form(title, kind, fields, extras = {}) {
    showDialog(title, `<form id="editor-form" class="editor-form" data-kind="${esc(kind)}" data-record-id="${esc(extras.id || '')}" data-record-index="${esc(extras.index ?? '')}">
      <div class="editor-grid">${fields}</div>
      <p id="editor-form-error" class="editor-form-error" role="alert" hidden></p>
      <div class="editor-form-actions"><button type="button" class="button button-quiet" data-action="editor-cancel">취소</button><button type="submit" class="button button-primary">저장</button></div>
    </form>`);
    requestAnimationFrame(() => document.querySelector('#editor-form input, #editor-form textarea, #editor-form select')?.focus());
  }

  function openProfile() {
    const p = data.profile;
    form('소개와 프로필 편집', 'profile', [
      field('name', '이름', p.name, {required: true, max: 100}),
      field('role', '직함', p.role, {max: 160}),
      field('lab', '소속', p.lab, {max: 180}),
      field('badge', '상단 소개 문구', p.badge, {max: 180}),
      field('hero1', '메인 제목 · 첫 줄', p.hero1, {max: 180}),
      field('hero2', '메인 제목 · 둘째 줄', p.hero2, {max: 180}),
      field('bio', '자기소개', p.bio, {type: 'textarea', rows: 5, wide: true, max: 10000}),
      field('pubs', '게재 논문 수', p.pubs, {max: 30}),
      field('cites', '총 인용 수', p.cites, {max: 30}),
      field('email', '이메일', p.email, {type: 'email', max: 250}),
      field('github', 'GitHub 주소', p.github, {type: 'url', max: 2000, placeholder: 'https://github.com/username'}),
      field('scholar', 'Google Scholar 주소', p.scholar, {type: 'url', max: 2000, wide: true}),
      `<label class="editor-field editor-field-wide editor-checkbox"><span><input type="checkbox" name="template"${data.meta.template ? ' checked' : ''}> 예시 콘텐츠 안내 표시</span><small>원본에 포함된 예시 이름·경력·논문을 실제 내용으로 바꾼 후 해제하세요.</small></label>`
    ].join(''));
  }

  function openPost(id, requestedType = 'research') {
    const existing = postTypes.flatMap(type => data[type]).find(post => post.id === id);
    if (id && !existing) return notify('게시글을 찾을 수 없습니다.');
    const localToday = new Date();
    const today = `${localToday.getFullYear()}-${String(localToday.getMonth()+1).padStart(2,'0')}-${String(localToday.getDate()).padStart(2,'0')}`;
    const p = existing || {type: postTypes.includes(requestedType) ? requestedType : 'research', date: today};
    form(existing ? '게시글 편집' : '새 게시글', 'post', [
      select('type', '게시판', postTypes.map(type => [type, labels[type]]), p.type),
      field('date', '게시일', p.date, {type: 'date', required: true}),
      field('title', '제목', p.title, {required: true, max: 400, wide: true}),
      field('category', '분류', p.category, {max: 140, wide: true}),
      field('summary', '짧은 소개', p.summary, {type: 'textarea', rows: 3, max: 4000, wide: true}),
      field('content', '본문', p.content, {type: 'textarea', rows: 12, max: 200000, wide: true, note: '일반 텍스트와 기본 HTML 문단·제목·목록·코드 서식을 사용할 수 있습니다.'}),
      field('link1', '논문 / 자료 링크', p.link1, {max: 2000, placeholder: 'https://…'}),
      field('link2', '코드 / 관련 링크', p.link2, {max: 2000, placeholder: 'https://…'})
    ].join(''), {id: existing?.id});
  }

  function openCv(id) {
    const item = id ? data.cv.find(record => record.id === id) : {};
    if (!item) return notify('이력 항목을 찾을 수 없습니다.');
    form(id ? '이력 편집' : '이력 추가', 'cv', [
      select('type', '구분', [['edu', '학력'], ['exp', '연구 경력']], item.type || 'edu'),
      field('period', '기간', item.period, {required: true, max: 100, placeholder: '2025 — 현재'}),
      field('title', '학위 / 직함', item.title, {required: true, max: 300, wide: true}),
      field('org', '학교 / 기관', item.org, {max: 300, wide: true}),
      field('desc', '설명', item.desc, {type: 'textarea', max: 10000, wide: true})
    ].join(''), {id});
  }

  function openSkill(id) {
    const item = id ? data.skills.find(record => record.id === id) : {};
    if (!item) return notify('기술 항목을 찾을 수 없습니다.');
    form(id ? '기술 편집' : '기술 추가', 'skill', [
      field('title', '분야 이름', item.title, {required: true, max: 180, wide: true}),
      field('tags', '기술 목록', (item.tags || []).join(', '), {type: 'textarea', required: true, max: 4000, wide: true, note: '쉼표 또는 줄바꿈으로 구분하세요.'})
    ].join(''), {id});
  }

  function openFocus(index) {
    const item = data.focus[index];
    if (!item) return notify('연구 분야를 찾을 수 없습니다.');
    form('주요 연구 분야 편집', 'focus', [
      field('title', '연구 분야', item.title, {required: true, max: 200, wide: true}),
      field('description', '설명', item.description, {type: 'textarea', max: 10000, wide: true})
    ].join(''), {index});
  }

  function validWebLink(value, label) {
    if (!value || value === '#') return value;
    let parsed;
    try { parsed = new URL(value); } catch { throw new Error(`${label}에 https://로 시작하는 전체 주소를 입력해 주세요.`); }
    if (!['http:', 'https:'].includes(parsed.protocol) || parsed.username || parsed.password) throw new Error(`${label}에는 http 또는 https 주소만 사용할 수 있습니다.`);
    return value;
  }

  function submitEditor(event) {
    const element = event.target;
    if (!(element instanceof HTMLFormElement) || element.id !== 'editor-form') return;
    event.preventDefault();
    if (!isLocal || !editing || !element.reportValidity()) return;
    const fields = new FormData(element);
    const val = name => String(fields.get(name) || '').trim();
    const kind = element.dataset.kind;
    const id = element.dataset.recordId;
    const next = clone(data);
    try {
      if (kind === 'profile') {
        const keys = ['name','role','lab','badge','hero1','hero2','bio','pubs','cites','email','github','scholar'];
        for (const key of keys) next.profile[key] = val(key);
        validWebLink(next.profile.github, 'GitHub 주소');
        validWebLink(next.profile.scholar, 'Google Scholar 주소');
        next.meta.template = fields.has('template');
      } else if (kind === 'post') {
        const type = val('type');
        if (!postTypes.includes(type)) throw new Error('올바른 게시판을 선택해 주세요.');
        const current = postTypes.flatMap(key => next[key]).find(post => post.id === id);
        const post = {...current, id: current?.id || uid(type.slice(0, 3)), type,
          title: val('title'), category: val('category'), summary: val('summary'), content: val('content'), date: val('date'),
          link1: validWebLink(val('link1'), '논문 / 자료 링크'), link2: validWebLink(val('link2'), '코드 / 관련 링크')};
        const sameTypeIndex = next[type].findIndex(item => item.id === id);
        for (const key of postTypes) next[key] = next[key].filter(item => item.id !== id);
        if (sameTypeIndex >= 0) next[type].splice(sameTypeIndex, 0, post); else next[type].unshift(post);
      } else if (kind === 'cv') {
        const type = val('type');
        if (!['edu','exp'].includes(type)) throw new Error('올바른 이력 구분을 선택해 주세요.');
        const index = next.cv.findIndex(item => item.id === id);
        const record = {...(next.cv[index] || {}), id: id || uid('cv'), type, title: val('title'), period: val('period'), org: val('org'), desc: val('desc')};
        if (index >= 0) next.cv[index] = record; else next.cv.unshift(record);
      } else if (kind === 'skill') {
        const tags = [...new Set(val('tags').split(/[,\n]/).map(tag => tag.trim()).filter(Boolean))];
        if (!tags.length) throw new Error('기술을 하나 이상 입력해 주세요.');
        const index = next.skills.findIndex(item => item.id === id);
        const record = {...(next.skills[index] || {}), id: id || uid('sk'), title: val('title'), tags};
        if (index >= 0) next.skills[index] = record; else next.skills.push(record);
      } else if (kind === 'focus') {
        const index = Number(element.dataset.recordIndex);
        if (!Number.isInteger(index) || !next.focus[index]) throw new Error('연구 분야를 찾을 수 없습니다.');
        next.focus[index] = {...next.focus[index], title: val('title'), description: val('description')};
      } else return;
      commit(next);
    } catch (error) {
      const message = document.getElementById('editor-form-error');
      if (message) { message.textContent = error.message || '입력 내용을 확인해 주세요.'; message.hidden = false; message.scrollIntoView({block: 'nearest'}); }
    }
  }

  function download(content, filename, type) {
    const url = URL.createObjectURL(new Blob([content], {type}));
    const anchor = document.createElement('a');
    anchor.href = url; anchor.download = filename;
    document.body.appendChild(anchor); anchor.click(); anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  function snapshotHtml() {
    const snapshot = normalizeData(clone(data));
    snapshot.meta = {...snapshot.meta, revision: uid('snapshot')};
    const page = document.documentElement.cloneNode(true);
    const embedded = page.querySelector('#site-data');
    if (!embedded) return notify('내보내기용 데이터 영역을 찾지 못했습니다. JSON 백업을 저장해 주세요.');
    embedded.textContent = JSON.stringify(snapshot).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
    page.querySelectorAll('#main, #editor-bar, #dialog-body, #dialog-title, #toast, #print-content').forEach(node => { node.innerHTML = ''; });
    page.querySelectorAll('dialog').forEach(node => node.removeAttribute('open'));
    page.querySelectorAll('[data-editor-only]').forEach(node => node.remove());
    page.querySelectorAll('.editing, .is-editing, .local-state, .dialog-open, .modal-open').forEach(node => node.classList.remove('editing', 'is-editing', 'local-state', 'dialog-open', 'modal-open'));
    page.classList.remove('editing', 'is-editing', 'local-state', 'dialog-open', 'modal-open', 'is-local');
    page.querySelector('#toast')?.classList.remove('show');
    page.querySelector('body')?.style.removeProperty('overflow');
    page.querySelectorAll('#editor-bar, #local-edit-trigger').forEach(node => { node.hidden = true; });
    return '<!DOCTYPE html>\n' + page.outerHTML;
  }

  function exportHtml() {
    const html = snapshotHtml();
    if (!html) return;
    download(html, 'robotics_researcher_portfolio_cms.html', 'text/html;charset=utf-8');
    notify('공개용 HTML을 저장했습니다. 이 파일을 게시하면 현재 내용이 그대로 표시됩니다.');
  }

  async function copyEmbedCode() {
    const html = snapshotHtml();
    if (!html) return;
    try {
      if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
      await navigator.clipboard.writeText(html);
      notify('Google Sites용 코드를 복사했습니다. 삽입 → 삽입 → 코드 삽입에 붙여넣어 주세요.');
    } catch (error) {
      showDialog('Google Sites 코드 복사', `<p class="editor-note" style="margin-bottom:12px">아래 코드가 선택되어 있습니다. Ctrl+C 또는 ⌘C로 복사한 뒤 Google Sites의 코드 삽입에 붙여넣으세요.</p><label class="editor-field" for="editor-embed-code"><span>현재 내용을 포함한 전체 HTML</span><textarea id="editor-embed-code" readonly spellcheck="false" rows="12" style="width:100%;resize:vertical;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:12px;font:11px/1.6 var(--mono)">${esc(html)}</textarea></label>`);
      const field = document.getElementById('editor-embed-code');
      field.focus(); field.select();
    }
  }

  function backup() {
    download(JSON.stringify(data, null, 2), `robotics_portfolio_backup_${new Date().toISOString().slice(0,10)}.json`, 'application/json;charset=utf-8');
    notify('JSON 백업을 저장했습니다.');
  }

  function restore() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.json,application/json';
    input.addEventListener('change', async () => {
      const file = input.files?.[0];
      if (!file) return;
      if (file.size > 8 * 1024 * 1024) return notify('8MB 이하의 JSON 백업 파일을 선택해 주세요.');
      try {
        const parsed = JSON.parse(await file.text());
        if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed) || !['research','study','archive','cv','skills'].some(key => Array.isArray(parsed[key]))) throw new Error('백업 구조를 확인할 수 없습니다. 이 사이트나 기존 CMS에서 내보낸 JSON을 선택해 주세요.');
        const candidate = normalizeData(parsed);
        if (!confirm('백업 내용으로 현재 편집 내용을 교체할까요?')) return;
        commit(candidate, '백업 내용을 복원했습니다. 공개 페이지에 반영하려면 HTML을 내보내 주세요.');
      } catch (error) { notify(error.message || '백업 파일을 읽을 수 없습니다.'); }
    }, {once: true});
    input.click();
  }

  function reset() {
    if (!confirm('이 파일을 처음 열었을 때의 내용으로 되돌릴까요? 현재 임시 수정은 삭제됩니다.')) return;
    data = normalizeData(clone(initialData));
    try { localStorage.removeItem(DRAFT_KEY); } catch (error) { /* Drafts may be blocked by browser settings. */ }
    closeDialog(); renderApp(); notify('이 파일에 저장된 초기 내용으로 되돌렸습니다.');
  }

  function removeRecord(kind, id) {
    const groups = kind === 'post' ? postTypes : [kind];
    const exists = groups.some(group => data[group].some(item => item.id === id));
    if (!exists) return;
    if (!confirm('이 항목을 삭제할까요?')) return;
    const next = clone(data);
    groups.forEach(group => { next[group] = next[group].filter(item => item.id !== id); });
    commit(next, '삭제했습니다.');
  }

  document.addEventListener('submit', submitEditor);
  document.addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button || !isLocal) return;
    const action = button.dataset.action;
    if (action === 'toggle-editor') {
      event.preventDefault();
      editing = !editing;
      closeDialog(); renderApp();
      if (editing) notify('이 기기에서 편집을 시작합니다. 공개 페이지는 HTML을 내보낸 뒤 교체해 주세요.');
      return;
    }
    if (!editing) return;
    const actions = {
      'edit-profile': () => openProfile(),
      'add-post': () => openPost('', button.dataset.type),
      'edit-post': () => openPost(button.dataset.id),
      'delete-post': () => removeRecord('post', button.dataset.id),
      'edit-cv': () => openCv(button.dataset.id),
      'delete-cv': () => removeRecord('cv', button.dataset.id),
      'edit-skill': () => openSkill(button.dataset.id),
      'delete-skill': () => removeRecord('skills', button.dataset.id),
      'edit-focus': () => openFocus(Number(button.dataset.index)),
      'editor-export': exportHtml,
      'editor-copy-embed': copyEmbedCode,
      'editor-backup': backup,
      'editor-restore': restore,
      'editor-reset': reset,
      'editor-cancel': closeDialog
    };
    if (actions[action]) { event.preventDefault(); actions[action](); }
  });
})();

startApp();
</script>
</body>
</html>
